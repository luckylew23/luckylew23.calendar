<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="textus-resource:panel.css" />
  </head>
  <body>
    <div class="tx-bar" id="bar">
      <button class="tx-icon-button" id="prev"><span class="tx-icon" data-icon="left"></span></button>
      <button id="month" class="month"></button>
      <button class="tx-button small" id="today"></button>
      <button class="tx-icon-button" id="next"><span class="tx-icon" data-icon="right"></span></button>
    </div>
    <div id="grid" class="tx-calendar" role="grid"></div>
    <p id="nofolder" class="tx-empty" hidden></p>
    <section id="day" hidden>
      <div class="tx-bar" id="daybar">
        <span id="daytitle" class="day-title"></span>
        <button class="tx-button small" id="newday"></button>
      </div>
      <div id="daylist" class="tx-list" role="list"></div>
      <p id="dayempty" class="tx-empty" hidden></p>
    </section>
    <script src="textus-resource:panel.js"></script>
  </body>
</html>
